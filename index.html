<!DOCTYPE html>
    <html lang = "es"> <!-- El contenido de esta pagina esta en español (es) -->

        <head>
            <meta charset = "utf-8"> <!-- Interpreta caracteres como "ñ" o acentos -->
            <meta name = "viewport" content = "width = device-width, initial-scale = 1.0"> 
                <!-- Haz que el ancho de la pagina corresponda al ancho del dispositivo -->
            
            <title> Gallardo Motors & Co. </title>

            <link rel="stylesheet" href="Estilos.css">
        </head> 

        <body>
            <header> 
                <h1> Gallardo Motors & Co. </h1>
                <p> Sistema de Registro de Vehículos </p>

                <h2 id="tituloFormulario">
                    Nuevo Registro
                </h2>
            </header>

            <section id="seccionRegistro">

                <section>
                    <h2> Datos del propietario </h2>

                    <label for="nombre"> Nombre: </label>
                    <input type="text" id="nombre">

                    <label for="telefono"> Telefono: </label>
                    <input type="tel" id="telefono">

                    <br> <br> <!-- "Brinca un renglón" -->

                    <label for="correo"> Correo: </label>
                    <input type="email" id="correo">
                </section>

                <section>
                    <h2> Datos del vehículo </h2>

                    <label for="marca"> Marca: </label>
                    <select id="marca"> <!-- Como un combo box con sus respectivas opciones (option) -->
                        <option> Toyota </option>
                        <option> Mercedes - Benz </option>
                        <option> BMW </option>
                        <option> Volkswagen </option>
                        <option> Porsche </option>
                        <option> Tesla </option>
                        <option> Honda </option>
                        <option> Ford </option>
                        <option> Audi </option>
                        <option> BYD </option>
                        <option> Ferrari </option>
                        <option> Chevrolet </option>
                        <option> Volvo </option>
                        <option> Kia </option>
                        <option> Lexus </option>
                        <option> Nissan </option>
                        <option> Renault </option>
                        <option> Jeep </option>
                        <option> Subaru </option>
                        <option> Suzuki </option>
                    </select>

                    <br><br>

                    <label for="modelo"> Modelo: </label>
                    <select id="modelo">
                        <option value="">Selecciona un modelo</option>
                    </select>

                    <br><br>

                    <label for="año"> Año: </label>
                    <input type="number" id="año">

                    <br><br>

                    <label for="color"> Color: </label>
                    <input type="text" id="color">
                    
                    <br><br>

                    <label for="numeroSerie"> Numero de serie: </label>
                    <input type="text" id="numeroSerie">
                </section>

                <section>
                    <h2> Tipo de vehículo </h2> <!-- Como todos pertenecen al mismo name (tipo) solo se podrá seleccionar una opcion -->

                    <input type="radio" id="automovil" name="tipo" value="Automóvil">
                    <label for="automovil"> Automóvil </label>

                    <input type="radio" id="camioneta" name="tipo" value="Camioneta">
                    <label for="camioneta"> Camioneta </label>

                    <input type="radio" id="suv" name="tipo" value="SUV">
                    <label for="suv"> SUV </label>

                    <input type="radio" id="motocicleta" name="tipo" value="Motocicleta">
                    <label for="motocicleta">Motocicleta</label>
                </section>

                <section> 
                    <h2>Servicio solicitado</h2> <!-- Como en esta seccion se pueden escoger varias opciones, no sería conveniente usar name -->

                    <input type="checkbox" id="afinacion" value="Afinación">
                    <label for="afinacion"> Afinación </label>

                    <input type="checkbox" id="aceite" value="Cambio de aceite">
                    <label for="aceite"> Cambio de aceite </label>

                    <input type="checkbox" id="frenos" value="Frenos">
                    <label for="frenos"> Frenos </label>

                    <input type="checkbox" id="suspension" value="Suspensión">
                    <label for="suspension"> Suspensión </label>

                    <input type="checkbox" id="motor" value="Reparación de motor">
                    <label for="motor"> Reparación de motor </label>

                    <input type="checkbox" id="pintura" value="Cambio de pintura">
                    <label for="pintura"> Cambio de pintura </label>

                    <input type="checkbox" id="diagnostico" value="Diagnóstico">
                    <label for="diagnostico"> Diagnóstico </label>

                    <input type="checkbox" id="otro" value="Otro">
                    <label for="otro"> Otro </label>
                    
                    <br> <br>
                    <label for="descripcion"> Descripción del servicio: </label>
                    <br>
                    <textarea id="descripcion" rows="5" cols="50"></textarea> 
                        <!-- textarea esta pensado para un texto mas largo -->
                </section>

                <button id="btnRegistrar"> Registrar </button>
                <button id="btnVerRegistros"> Ver registros </button>

            </section>

            <section id="seccionRegistros">
                <h2>Registros</h2>
                
                <label for="buscadorRegistros">Buscar registro</label>

                <input type="text" id="buscadorRegistros" placeholder="Buscar por cliente, marca o modelo">
                <!-- Placeholder muestra un texto de ejemplo o una pista tenue dentro de un campo antes de escribir algo y desaparece al escribir -->
                
                <div id="listaRegistros"></div>

                <button id="btnVolverRegistro"> Volver a registrar </button>
            </section>
    
            <script src="Codigo.js"></script>
        </body>
</html>
